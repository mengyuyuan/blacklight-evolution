plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.143' }
version = '0.1.0-dev.1'
group = 'com.codex.passives'
base { archivesName = 'Adaptive-Passives-MC1.21.1-NeoForge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.244'
    parchment { mappingsVersion = '2024.11.17'; minecraftVersion = '1.21.1' }
    runs {
        client { client(); if (project.hasProperty('clientRunDirectory')) gameDirectory = file(project.property('clientRunDirectory')); if (project.hasProperty('quickPlayWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlayWorld').toString() }
        server { server(); programArgument '--nogui'; if (project.hasProperty('serverRunDirectory')) gameDirectory = file(project.property('serverRunDirectory')) }
        gameTestServer {
            jvmArgument '-Xmx1G'; type = 'gameTestServer'
            if (project.hasProperty('gameTestRunDirectory')) gameDirectory = file(project.property('gameTestRunDirectory'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'adaptive_passives'
        }
    }
    mods { adaptive_passives { sourceSet sourceSets.main } }
}
if (project.hasProperty('passiveGameTest')) { sourceSets.main.java.srcDir('src/gameTest/java'); sourceSets.main.resources.srcDir('src/gameTest/resources') }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from 'LICENSE'; exclude '**/gametest/**' }

// Optional integration fixtures use the parent's already-built classes; not a production dependency.
if (project.hasProperty('passiveCompat')) {
    sourceSets {
        blacklightCompat {
            java.srcDirs = []; resources.srcDirs = []
            output.classesDirs.setFrom(file('../build/classes/java/main'))
            output.resourcesDir = file('../build/resources/main')
        }
    }
    sourceSets.main.java.srcDir('src/compatTest/java')
    dependencies { runtimeOnly files(sourceSets.blacklightCompat.output) }
    repositories { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
    neoForge.mods { blacklight { sourceSet sourceSets.blacklightCompat } }
    dependencies {
        runtimeOnly 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2'
    }
    // The parent's loose development classes need its bundled decoder on the game classpath.
    neoForge.runs.configureEach {
        additionalRuntimeClasspathConfiguration.dependencies.add(project.dependencies.create('org.tukaani:xz:1.10'))
    }
}
tasks.named('jar') { exclude 'data/adaptive_passives/structure/empty.nbt', 'data/adaptive_passives/structures/empty.nbt' }

if (project.hasProperty('passiveNetworkTest')) {
    sourceSets.main.java.srcDir('src/networkTest/java')
    neoForge.runs.configureEach { systemProperty 'passive.qa.dir', file(project.property('passiveNetworkTest')).absolutePath; jvmArgument '-Xmx1G' }
    if (project.hasProperty('qaAddress')) neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer', project.property('qaAddress').toString()
}
