plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

// Private inputs remain outside versioned resources. Neither current profile is
// an approved public release; source-only also lacks required runtime motions.
def bundledMotionDirectory = providers.gradleProperty('bundleMotionDirectory')
def releaseProfile = bundledMotionDirectory.isPresent() ? 'local-preview' : 'source-only'
def releaseNotices = ['LICENSE', 'THIRD_PARTY_ASSETS.md', 'THIRD_PARTY_NOTICES.md']
def privateMotionOutputs = [layout.buildDirectory.dir('generated/bundledMotionResources'),
                            layout.buildDirectory.dir('resources/main/blacklight/bundled_motions'),
                            layout.buildDirectory.dir('resources/main/assets/blacklight/textures/private_devfx')]
// Sync's empty-source handling is not a packaging boundary. Clear both generated
// and previously processed copies explicitly before a source-only resource build.
def clearPrivateMotionOutputs = tasks.register('clearPrivateMotionOutputs', Delete) {
    onlyIf { !bundledMotionDirectory.isPresent() }
    delete privateMotionOutputs
    doFirst {
        def buildRoot = layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        privateMotionOutputs.each { output ->
            def target = output.get().asFile.toPath().toAbsolutePath().normalize()
            if (target == buildRoot || !target.startsWith(buildRoot)) {
                throw new GradleException("Refusing to clear private staging outside build directory: ${target}")
            }
        }
    }
}
def stageBundledMotions = tasks.register('stageBundledMotions', Sync) {
    dependsOn clearPrivateMotionOutputs
    into layout.buildDirectory.dir('generated/bundledMotionResources')
    if (bundledMotionDirectory.isPresent()) {
        from(bundledMotionDirectory.get()) {
            into 'blacklight/bundled_motions'
            include '*.json', 'combat-motion-tuning.data', 'consume-placement.data', 'consume-receiver-events.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data', 'camera-film.data', 'health-hud.data'
        }
        doFirst {
            def profile = file(bundledMotionDirectory.get())
            ['health-hud.data', 'camera-film.data', 'morph_claws.json', 'morph_blade.json', 'morph_hammerfists.json', 'morph_muscle_mass.json', 'morph_whipfist.json', 'morph_thermal_vision.json'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete cinematic motion profile: ${it}")
            }
            ['utility_shield_deploy.json', 'utility_shield_hit.json', 'utility_shield_run.json', 'utility_shield_sprint.json', 'utility_armor_transform.json', 'utility_armor_idle.json', 'basic_idle.json', 'basic_wall_top.json', 'basic_parkour_small.json', 'combat-motion-tuning.data', 'consume-placement.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete bundled motion profile: ${it}")
            }
            ['dev_groundspike','dev_air_groundspike','dev_tendril','dev_air_tendril','dev_critical_pain','dev_air_critical_pain','bulletdive_drop'].each {
                if (!new File(profile, it + '.json').isFile() || !new File(profile, it + '_charge.json').isFile())
                    throw new GradleException("Incomplete source skill profile: ${it}")
            }
        }
    }
}
sourceSets.main.resources.srcDir(stageBundledMotions)
tasks.named('processResources', ProcessResources).configure {
    dependsOn clearPrivateMotionOutputs
    inputs.property('blacklightReleaseProfile', releaseProfile)
    if (!bundledMotionDirectory.isPresent()) exclude 'blacklight/bundled_motions/**'
    if (!bundledMotionDirectory.isPresent()) exclude 'assets/blacklight/textures/private_devfx/**'
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
}

base {
    archivesName = "${mod_archive_name}-MC${minecraft_version}-NeoForge"
}

// Keep both version numbers in every release; never hand-name the install ZIP.
def distributionZip = tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Packages a local-preview or source-only candidate with notices; not a public release.'
    archiveBaseName = base.archivesName
    archiveVersion = project.version.toString()
    archiveClassifier = releaseProfile
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'mods' }
    from('README.md')
    from(releaseNotices)
    exclude 'blacklight/bundled_motions/devastator-fx.data', 'assets/blacklight/textures/private_devfx/**'
    exclude 'assets/blacklight/shaders/core/source_biomass.*', 'com/codex/blacklight/client/renderer/DevastatorSourceMesh*.class'
    from('docs') { into 'docs' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn(distributionZip) }
tasks.named('assemble') {
    description = 'Compiles and packages a candidate. Source-only lacks required runtime assets; neither profile is cleared for public release.'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Opt-in screenshot harness is excluded from normal builds and distributable JARs.
if (project.hasProperty('hiveFeedingTest')) {
    sourceSets.main.java.srcDir('src/hiveTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}
if (project.hasProperty('wallTraversalTest')) {
    sourceSets.main.java.srcDir('src/traversalTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}
if (project.hasProperty('standaloneVisual') || project.hasProperty('standaloneGait') || project.hasProperty('standaloneLock') || project.hasProperty('standaloneMorph') || project.hasProperty('standaloneSkill')) {
    sourceSets.main.java.srcDir('src/standaloneVisualTest/java')
}
if (project.hasProperty('standaloneTest')) {
    sourceSets.main.java.srcDir('src/standaloneTest/java')
    if (!project.hasProperty('wallTraversalTest') && !project.hasProperty('hiveFeedingTest')) {
        sourceSets.main.resources.srcDir('src/traversalTest/resources')
    }
}
tasks.named('jar', Jar).configure {
    archiveClassifier = releaseProfile
    from(releaseNotices)
    exclude 'blacklight/bundled_motions/devastator-fx.data', 'assets/blacklight/textures/private_devfx/**'
    exclude 'assets/blacklight/shaders/core/source_biomass.*', 'com/codex/blacklight/client/renderer/DevastatorSourceMesh*.class'
    manifest.attributes('Blacklight-Build-Profile': releaseProfile,
            'Blacklight-Private-Assets': bundledMotionDirectory.isPresent().toString(),
            'Blacklight-Public-Release-Ready': 'false',
            'Blacklight-Asset-Notice': 'THIRD_PARTY_ASSETS.md')
    // Even if stale generated resources exist or tasks are skipped, source-only
    // artifacts cannot acquire the private namespace from an earlier local build.
    if (!bundledMotionDirectory.isPresent()) exclude 'blacklight/bundled_motions/**'
    if (!bundledMotionDirectory.isPresent()) exclude 'assets/blacklight/textures/private_devfx/**'
    exclude 'com/codex/blacklight/gametest/**'
    exclude 'com/codex/blacklight/client/Standalone*Smoke*.class'
    exclude 'com/codex/blacklight/client/StandaloneCriticalMassChecks*.class'
    exclude 'com/codex/blacklight/client/StandaloneBulletTerrainChecks*.class'
    exclude 'data/blacklight/structure/wall_test.nbt'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            if (project.hasProperty('clientRunDirectory')) gameDirectory = file(project.property('clientRunDirectory'))
            if (project.hasProperty('standaloneVisual')) {
                systemProperty 'blacklight.test.standaloneVisual', file(project.property('standaloneVisual')).absolutePath
                if (project.hasProperty('standaloneVisualShots')) systemProperty 'blacklight.test.standaloneVisual.shots', project.property('standaloneVisualShots').toString()
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneLock')) {
                systemProperty 'blacklight.test.standaloneLock', file(project.property('standaloneLock')).absolutePath
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneGait')) {
                systemProperty 'blacklight.test.standaloneGait', file(project.property('standaloneGait')).absolutePath
                if (project.hasProperty('standaloneGaitJump')) systemProperty 'blacklight.test.standaloneGait.jumpOnly', 'true'
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneMorph')) {
                systemProperty 'blacklight.test.standaloneMorph', file(project.property('standaloneMorph')).absolutePath
                if (project.hasProperty('standaloneMorphCases')) systemProperty 'blacklight.test.standaloneMorph.cases', project.property('standaloneMorphCases').toString()
                programArguments.addAll '--width', '960', '--height', '640'
            }
            if (project.hasProperty('standaloneSkill')) {
                systemProperty 'blacklight.test.standaloneSkill', file(project.property('standaloneSkill')).absolutePath
                if (project.hasProperty('standaloneSkillCases')) systemProperty 'blacklight.test.standaloneSkill.cases', project.property('standaloneSkillCases').toString()
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('localWeaponMotions')) {
                systemProperty 'blacklight.localWeaponMotions', file(project.property('localWeaponMotions')).absolutePath
            }
            // This machine has 16 GB RAM shared with other tools; cap the client heap
            // so the game JVM cannot exhaust native memory and crash (see hs_err logs).
            jvmArgument '-Xmx3G'
            // Optional developer shortcut: .\gradlew runClient -PquickPlayWorld=<save folder>
            // Keeps normal launches unchanged while allowing repeatable movement tests.
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
            }
            // Developer-only visual acceptance hook. Normal launches never set it.
            if (project.hasProperty('openAnimationTuner')) {
                systemProperty 'blacklight.test.openAnimationTuner', 'true'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file(project.hasProperty('standaloneTest') && !project.hasProperty('wallTraversalTest') ? 'run-standalone-gametest' : project.hasProperty('hiveFeedingTest') ? 'run-hive-feeding-gametest' : 'run-wall-gametest')
            jvmArgument '-Xmx2G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('localWeaponMotions')) {
                systemProperty 'blacklight.localWeaponMotions', file(project.property('localWeaponMotions')).absolutePath
            }
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Optional compatibility API only. The user installs the two mods independently.
    compileOnly "maven.modrinth:parcool:1.21.1-3.4.3.3"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // BlacklightState exposes a Minecraft Codec; plain JVM tests therefore need DFU too.
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation files(sourceSets.main.compileClasspath)
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Native pose tests use the project-authored mathematical bind hierarchy.
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
// Current candidates have unresolved asset clearance/runtime readiness. Block
// both repository publishing and publishToMavenLocal until a reviewed public
// release profile is deliberately implemented; ordinary assemble still works.
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    doFirst {
        throw new GradleException("Publishing is disabled for ${releaseProfile}: current candidates are not cleared for public release.")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// This source set deliberately has no Minecraft, NeoForge or Epic Fight dependency.
sourceSets {
    standaloneMotion {
        java {
            srcDirs = ['src/main/java', 'tools']
            include 'com/codex/blacklight/animation/MatrixMotionClip.java', 'StandaloneMotionProbe.java'
        }
    }
}
dependencies {
    standaloneMotionImplementation 'com.google.code.gson:gson:2.10.1'
    standaloneMotionImplementation 'org.joml:joml:1.10.5'
}
tasks.register('verifyStandaloneMotionAssets', JavaExec) {
    group = 'verification'
    description = 'Samples the supplied motion archive without the game or Epic Fight on the classpath.'
    dependsOn tasks.named('standaloneMotionClasses')
    classpath = sourceSets.standaloneMotion.runtimeClasspath
    mainClass = 'StandaloneMotionProbe'
    maxHeapSize = '1G'
    doFirst {
        def archive = providers.gradleProperty('motionProbeArchive')
        if (!archive.isPresent()) throw new GradleException('Supply -PmotionProbeArchive=<RC59 local-preview jar>')
        args = [archive.get()]
    }
}

tasks.register('verifyStandaloneBoundary') {
    group = 'verification'
    description = 'Rejects compiled references and runtime dependencies on Epic Fight or WoM.'
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = configurations.runtimeClasspath.files.findAll {
            def name = it.name.toLowerCase(Locale.ROOT)
            name.contains('epic-fight') || name.contains('epicfight') || name.contains('weaponsofmiracles')
        }.collect { it.name }
        def linked = []
        sourceSets.main.output.classesDirs.files.each { root ->
            fileTree(root).matching { include '**/*.class' }.each { compiled ->
                def constants = new String(compiled.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('yesman/epicfight') || constants.contains('reascer/wom'))
                    linked.add(root.toPath().relativize(compiled.toPath()).toString())
            }
        }
        if (!forbidden.empty || !linked.empty) {
            throw new GradleException("Not standalone: dependencies=${forbidden}; ${linked.size()} classes still reference old engines. See docs/STANDALONE_MIGRATION.md.")
        }
    }
}

// Every installable artifact must pass the independent runtime boundary.
tasks.named('jar') { dependsOn tasks.named('verifyStandaloneBoundary') }
