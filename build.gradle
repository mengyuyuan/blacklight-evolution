plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

// A normal clone includes the complete runtime profile. An explicit developer
// directory replaces it as one profile, preserving the runtime override contract.
def bundledMotionDirectory = providers.gradleProperty('bundleMotionDirectory').orElse('art/motion-profile')
def releaseProfile = providers.gradleProperty('bundleMotionDirectory').isPresent() ? 'external-profile' : 'bundled'
def releaseNotices = ['LICENSE', 'THIRD_PARTY_ASSETS.md', 'THIRD_PARTY_NOTICES.md']
def stageBundledMotions = tasks.register('stageBundledMotions', Sync) {
    into layout.buildDirectory.dir('generated/bundledMotionResources')
    if (bundledMotionDirectory.isPresent()) {
        from(bundledMotionDirectory.get()) {
            into 'blacklight/bundled_motions'
            include '*.json', 'combat-motion-tuning.data', 'consume-placement.data', 'consume-receiver-events.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'weapon-attack-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data', 'camera-film.data', 'health-hud.data'
        }
        doFirst {
            def profile = file(bundledMotionDirectory.get())
            ['health-hud.data', 'camera-film.data', 'morph_claws.json', 'morph_blade.json', 'morph_hammerfists.json', 'morph_muscle_mass.json', 'morph_whipfist.json', 'morph_thermal_vision.json'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete cinematic motion profile: ${it}")
            }
            ['utility_shield_deploy.json', 'utility_shield_hit.json', 'utility_shield_run.json', 'utility_shield_sprint.json', 'utility_armor_transform.json', 'utility_armor_idle.json', 'basic_idle.json', 'basic_wall_top.json', 'basic_parkour_small.json', 'combat-motion-tuning.data', 'consume-placement.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'weapon-attack-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete bundled motion profile: ${it}")
            }
            ['dev_groundspike','dev_air_groundspike','dev_tendril','dev_air_tendril','dev_critical_pain','dev_air_critical_pain','bulletdive_drop'].each { skill ->
                ['', '_charge', '_recovery'].each { suffix ->
                    if (!new File(profile, skill + suffix + '.json').isFile())
                        throw new GradleException("Incomplete source skill profile: ${skill}${suffix}")
                }
            }
            ['dev_critical_pain_aim_up','dev_critical_pain_aim_down','dev_air_critical_pain_aim_up','dev_air_critical_pain_aim_down','bulletdive_drop_land','bulletdive_drop_flight'].each {
                if (!new File(profile, it + '.json').isFile()) throw new GradleException("Incomplete source skill profile: ${it}")
            }
        }
    }
}
sourceSets.main.resources.srcDir(stageBundledMotions)
tasks.named('processResources', ProcessResources).configure {
    inputs.property('blacklightReleaseProfile', releaseProfile)
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
}

base {
    archivesName = "${mod_archive_name}-MC${minecraft_version}-NeoForge"
}

// Keep both version numbers in every release; never hand-name the install ZIP.
def distributionZip = tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Packages the complete standalone candidate with bundled motions and notices.'
    archiveBaseName = base.archivesName
    archiveVersion = project.version.toString()
    archiveClassifier = releaseProfile
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'mods' }
    from('README.md')
    from(releaseNotices)
    exclude 'blacklight/bundled_motions/devastator-fx.data', 'assets/blacklight/textures/private_devfx/**'
    exclude 'assets/blacklight/shaders/core/source_biomass.*', 'com/codex/blacklight/client/renderer/DevastatorSourceMesh*.class'
    from('docs') { into 'docs' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn(distributionZip) }
tasks.named('assemble') {
    description = 'Compiles and packages a complete standalone candidate with runtime motion data.'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

if (['compatLiveTest', 'hydraReleaseTest', 'hiveFeedingTest', 'wallTraversalTest', 'standaloneTest', 'cityTest', 'feedbackTest', 'releaseAuditTest', 'twilightTest', 'buildingBiomassTest'].any { project.hasProperty(it) }) {
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}

// Real optional-mod integration tests, never bundled into release jars.
if (project.hasProperty('compatLiveTest')) {
    sourceSets.main.java.srcDir('src/compatTest/java')
}

// Opt-in screenshot harness is excluded from normal builds and distributable JARs.
if (project.hasProperty('hydraReleaseTest')) {
    sourceSets.main.java.srcDir('src/hydraTest/java')
}
if (project.hasProperty('wingTest')) sourceSets.main.java.srcDir('src/wingTest/java')
if (project.hasProperty('hydraVisualTest')) sourceSets.main.java.srcDir('src/hydraVisualTest/java')
if (project.hasProperty('cityVisualTest')) sourceSets.main.java.srcDir('src/cityVisualTest/java')
if (project.hasProperty('weaponModelPreview')) sourceSets.main.java.srcDir('src/weaponVisualTest/java')
if (project.hasProperty('leanArmorPreview')) sourceSets.main.java.srcDir('src/armorVisualTest/java')
if (project.hasProperty('hiveFeedingTest')) {
    sourceSets.main.java.srcDir('src/hiveTest/java')
}
if (project.hasProperty('wallTraversalTest')) {
    sourceSets.main.java.srcDir('src/traversalTest/java')
}
if (project.hasProperty('standaloneInfected')) {
    sourceSets.main.java.srcDir('src/infectedVisualTest/java')
}
if (project.hasProperty('standaloneBulletExtreme') || project.hasProperty('standaloneTutorialInspect') || project.hasProperty('standaloneTutorial') || project.hasProperty('standaloneVisual') || project.hasProperty('standaloneGait') || project.hasProperty('standaloneLock') || project.hasProperty('standaloneMorph') || project.hasProperty('standaloneSkill') || project.hasProperty('standaloneSync')) {
    sourceSets.main.java.srcDir('src/standaloneVisualTest/java')
    if (!project.hasProperty('standaloneSync')) sourceSets.main.java.exclude '**/StandaloneSyncClientSmoke.java', '**/StandaloneSyncServerChecks.java'
}
if (project.hasProperty('standaloneTest')) {
    sourceSets.main.java.srcDir('src/standaloneTest/java')
}
if (project.hasProperty('releaseAuditTest')) {
    sourceSets.main.java.srcDir('src/releaseAuditTest/java')
}
if (project.hasProperty('cityTest')) {
    sourceSets.main.java.srcDir('src/cityTest/java')
    sourceSets.main.resources.srcDir('src/cityTest/resources')
}
tasks.named('jar', Jar).configure {
    archiveClassifier = releaseProfile
    from(releaseNotices)
    exclude 'blacklight/bundled_motions/devastator-fx.data', 'assets/blacklight/textures/private_devfx/**'
    exclude 'assets/blacklight/shaders/core/source_biomass.*', 'com/codex/blacklight/client/renderer/DevastatorSourceMesh*.class'
    manifest.attributes('Blacklight-Build-Profile': releaseProfile,
            'Blacklight-Motion-Source': releaseProfile == 'bundled' ? 'repository' : 'external',
            'Blacklight-Bundled-Motions': 'true',
            'Blacklight-Asset-Notice': 'THIRD_PARTY_ASSETS.md')
    exclude 'com/codex/blacklight/gametest/**'
    exclude 'com/codex/blacklight/city/*GameTest*.class'
    exclude 'data/minecraft/worldgen/world_preset/flat.json'
    exclude 'com/codex/blacklight/client/Standalone*Smoke*.class'
    exclude 'com/codex/blacklight/client/WingFlightSmoke*.class'
    exclude 'com/codex/blacklight/client/WingSupersonicSmoke*.class'
    exclude 'com/codex/blacklight/client/StandaloneCriticalMassChecks*.class'
    exclude 'com/codex/blacklight/client/StandaloneBulletTerrainChecks*.class'
    exclude 'com/codex/blacklight/client/StandaloneSyncServerChecks*.class'
    exclude 'com/codex/blacklight/client/InfectedCompositionSmoke*.class'
    exclude 'com/codex/blacklight/client/HydraReleaseSmoke*.class', 'com/codex/blacklight/client/CreatureCombatSmoke*.class'
    exclude 'data/blacklight/structure/wall_test.nbt'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            if(project.hasProperty('cityVisualTest')) {
                systemProperty 'blacklight.cityVisual', 'true'
                programArguments.addAll '--width', '1280', '--height', '800'
            }
            if(project.hasProperty('hydraVisualTest')) {
                systemProperty 'blacklight.hydraVisual', 'true'
                if(project.hasProperty('hydraVisualFast')) systemProperty 'blacklight.hydraVisualFast', 'true'
                if(project.hasProperty('creatureCombatVisual')) systemProperty 'blacklight.creatureCombatVisual', 'true'
                if(project.hasProperty('hunterRigOnly')) systemProperty 'blacklight.hunterRigOnly', 'true'
                programArguments.addAll '--width', '1280', '--height', '800'
            }
            if (project.hasProperty('wingTest')) {
                systemProperty 'blacklight.test.wings', 'true'
                if(project.hasProperty('wingQaDirectory')) systemProperty 'blacklight.test.wingDirectory', file(project.property('wingQaDirectory')).absolutePath
                if (project.hasProperty('wingSonicTest')) systemProperty 'blacklight.test.wingSonic', 'true'
                if (project.hasProperty('wingSonicClimbTest')) systemProperty 'blacklight.test.wingSonicClimb', 'true'
                if (project.hasProperty('wingArmorTest')) systemProperty 'blacklight.test.wingArmor', 'true'
                programArguments.addAll '--width', '960', '--height', '540'
            }
            if (project.hasProperty('standaloneInfected')) {
                systemProperty 'blacklight.test.infectedComposition', file(project.property('standaloneInfected')).absolutePath
                programArguments.addAll '--width', '1440', '--height', '1000'
            }
            if (project.hasProperty('clientRunDirectory')) gameDirectory = file(project.property('clientRunDirectory'))
            if (project.hasProperty('standaloneBulletExtreme')) systemProperty 'blacklight.test.bulletExtreme', file(project.property('standaloneBulletExtreme')).absolutePath
            if (project.hasProperty('tutorialFinalOnly')) systemProperty 'blacklight.test.tutorialInspect.finalOnly', 'true'
            if (project.hasProperty('standaloneTutorialInspect')) systemProperty 'blacklight.test.tutorialInspect', file(project.property('standaloneTutorialInspect')).absolutePath
            if (project.hasProperty('tutorialFilter')) systemProperty 'blacklight.test.tutorialFilter', project.property('tutorialFilter').toString()
            if (project.hasProperty('standaloneTutorial')) systemProperty 'blacklight.test.standaloneTutorial', file(project.property('standaloneTutorial')).absolutePath
            if (project.hasProperty('leanArmorPreview')) systemProperty 'blacklight.test.leanArmor', 'true'
            if (project.hasProperty('weaponModelPreview')) {
                systemProperty 'blacklight.test.weaponModels', file(project.property('weaponModelPreview')).absolutePath
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneVisual')) {
                systemProperty 'blacklight.test.standaloneVisual', file(project.property('standaloneVisual')).absolutePath
                if (project.hasProperty('standaloneVisualShots')) systemProperty 'blacklight.test.standaloneVisual.shots', project.property('standaloneVisualShots').toString()
                if (project.hasProperty('standaloneVisualFreshWorld')) systemProperty 'blacklight.test.standaloneVisual.freshWorld', 'true'
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneLock')) {
                systemProperty 'blacklight.test.standaloneLock', file(project.property('standaloneLock')).absolutePath
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneGait')) {
                systemProperty 'blacklight.test.standaloneGait', file(project.property('standaloneGait')).absolutePath
                if (project.hasProperty('standaloneGaitJump')) systemProperty 'blacklight.test.standaloneGait.jumpOnly', 'true'
                if (project.hasProperty('standaloneGaitClaws')) systemProperty 'blacklight.test.standaloneGait.claws', 'true'
                if (project.hasProperty('standaloneGaitStandingCharge')) systemProperty 'blacklight.test.standaloneGait.standingCharge', 'true'
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneMorph')) {
                systemProperty 'blacklight.test.standaloneMorph', file(project.property('standaloneMorph')).absolutePath
                if (project.hasProperty('standaloneMorphCases')) systemProperty 'blacklight.test.standaloneMorph.cases', project.property('standaloneMorphCases').toString()
                programArguments.addAll '--width', '960', '--height', '640'
            }
            if (project.hasProperty('standaloneSkillTutorialCapture')) systemProperty 'blacklight.test.skillTutorialCapture', 'true'
            if (project.hasProperty('standaloneSkill')) {
                systemProperty 'blacklight.test.standaloneSkill', file(project.property('standaloneSkill')).absolutePath
                if (project.hasProperty('standaloneSkillCases')) systemProperty 'blacklight.test.standaloneSkill.cases', project.property('standaloneSkillCases').toString()
                if (project.hasProperty('standaloneSkillFlightScene')) systemProperty 'blacklight.test.standaloneSkill.flightScene', 'true'
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('standaloneSync')) {
                systemProperty 'blacklight.test.standaloneSync', file(project.property('standaloneSync')).absolutePath
                programArguments.addAll '--width', '1280', '--height', '900'
            }
            if (project.hasProperty('localWeaponMotions')) {
                systemProperty 'blacklight.localWeaponMotions', file(project.property('localWeaponMotions')).absolutePath
            }
            // This machine has 16 GB RAM shared with other tools; cap the client heap
            // so the game JVM cannot exhaust native memory and crash (see hs_err logs).
            jvmArgument('-Xmx' + providers.gradleProperty('clientMaxHeap').orElse(project.hasProperty('hydraVisualTest') ? '1536M' : '3G').get())
            if(project.hasProperty('hydraVisualTest')) jvmArgument '-Xms128M'
            // Optional developer shortcut: .\gradlew runClient -PquickPlayWorld=<save folder>
            // Keeps normal launches unchanged while allowing repeatable movement tests.
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
            }
            if (project.hasProperty('quickPlayMultiplayer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickPlayMultiplayer').toString()
            }
            // Developer-only visual acceptance hook. Normal launches never set it.
            if (project.hasProperty('openAnimationTuner')) {
                systemProperty 'blacklight.test.openAnimationTuner', 'true'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            if (project.hasProperty('serverRunDirectory')) gameDirectory = file(project.property('serverRunDirectory'))
            if (project.hasProperty('standaloneSync')) systemProperty 'blacklight.test.standaloneSync', file(project.property('standaloneSync')).absolutePath
            jvmArgument(project.hasProperty('hydraReleaseTest') ? '-Xmx1G' : '-Xmx2G')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file(project.hasProperty('standaloneTest') && !project.hasProperty('wallTraversalTest') ? 'run-standalone-gametest' : project.hasProperty('hiveFeedingTest') ? 'run-hive-feeding-gametest' : 'run-wall-gametest')
            if (project.hasProperty('gameTestRunDirectory')) gameDirectory = file(project.property('gameTestRunDirectory'))
            jvmArgument(project.hasProperty('gameTestMaxHeap') ? '-Xmx' + project.property('gameTestMaxHeap') : '-Xmx2G')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('localWeaponMotions')) {
                systemProperty 'blacklight.localWeaponMotions', file(project.property('localWeaponMotions')).absolutePath
            }
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Optional compatibility API only. The user installs the two mods independently.
    compileOnly "maven.modrinth:parcool:1.21.1-3.4.3.3"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // BlacklightState exposes a Minecraft Codec; plain JVM tests therefore need DFU too.
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation files(sourceSets.main.compileClasspath)
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Native pose tests use the project-authored mathematical bind hierarchy.
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
// No Maven publication target has been configured for this development repo.
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    doFirst {
        throw new GradleException('Maven publication is not configured. Use the GitHub JAR/ZIP artifacts.')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// This source set deliberately has no Minecraft, NeoForge or Epic Fight dependency.
sourceSets {
    standaloneMotion {
        java {
            srcDirs = ['src/main/java', 'tools']
            include 'com/codex/blacklight/animation/MatrixMotionClip.java', 'StandaloneMotionProbe.java'
        }
    }
}
dependencies {
    standaloneMotionImplementation 'com.google.code.gson:gson:2.10.1'
    standaloneMotionImplementation 'org.joml:joml:1.10.5'
}
tasks.register('verifyStandaloneMotionAssets', JavaExec) {
    group = 'verification'
    description = 'Samples the supplied motion archive without the game or Epic Fight on the classpath.'
    dependsOn tasks.named('standaloneMotionClasses')
    classpath = sourceSets.standaloneMotion.runtimeClasspath
    mainClass = 'StandaloneMotionProbe'
    maxHeapSize = '1G'
    doFirst {
        def archive = providers.gradleProperty('motionProbeArchive')
        if (!archive.isPresent()) throw new GradleException('Supply -PmotionProbeArchive=<standalone bundled jar>')
        args = [archive.get()]
    }
}

tasks.register('verifyStandaloneBoundary') {
    group = 'verification'
    description = 'Rejects compiled references and runtime dependencies on Epic Fight or WoM.'
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = configurations.runtimeClasspath.files.findAll {
            def name = it.name.toLowerCase(Locale.ROOT)
            name.contains('epic-fight') || name.contains('epicfight') || name.contains('weaponsofmiracles')
        }.collect { it.name }
        def linked = []
        sourceSets.main.output.classesDirs.files.each { root ->
            fileTree(root).matching { include '**/*.class' }.each { compiled ->
                def constants = new String(compiled.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('yesman/epicfight') || constants.contains('reascer/wom'))
                    linked.add(root.toPath().relativize(compiled.toPath()).toString())
            }
        }
        if (!forbidden.empty || !linked.empty) {
            throw new GradleException("Not standalone: dependencies=${forbidden}; ${linked.size()} classes still reference old engines. See docs/STANDALONE_MIGRATION.md.")
        }
    }
}

// Every installable artifact must pass the independent runtime boundary.
tasks.named('jar') { dependsOn tasks.named('verifyStandaloneBoundary') }

// CI and a fresh clone must never produce another motion-less installable JAR.
tasks.register('verifyBundledMotionResources') {
    group = 'verification'
    dependsOn tasks.named('jar')
    doLast {
        def source = file(bundledMotionDirectory.get())
        def profile = fileTree(source).matching {
            include '*.json', '*.data'
            exclude 'devastator-fx.data'
        }.files
        if (profile.empty || !new File(source, 'basic_idle.json').isFile())
            throw new GradleException('A complete runtime motion profile is required')
        def manifest = releaseProfile == 'bundled'
                ? new groovy.json.JsonSlurper().parse(file('art/motion-profile-manifest.json')).files : null
        if (manifest != null && profile.collect { it.name }.toSet() != manifest.keySet())
            throw new GradleException('Repository motion inventory does not match its manifest')
        def archive = new java.util.zip.ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile)
        try {
            profile.each { input ->
                def entry = archive.getEntry("blacklight/bundled_motions/${input.name}")
                if (entry == null) throw new GradleException("Missing bundled motion: ${input.name}")
                def packed = archive.getInputStream(entry).withCloseable { it.readAllBytes() }
                if (!java.util.Arrays.equals(packed, input.bytes))
                    throw new GradleException("Bundled motion changed: ${input.name}")
                if (manifest != null) {
                    def expected = manifest[input.name]
                    if (packed.length != expected.bytes)
                        throw new GradleException("Motion manifest size mismatch: ${input.name}")
                    if (expected.sha256 != null) {
                        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(packed).encodeHex().toString()
                        if (hash != expected.sha256)
                            throw new GradleException("Motion manifest mismatch: ${input.name}")
                    }
                }
            }
            logger.lifecycle("Verified ${profile.size()} unchanged bundled motion/profile files")
        } finally { archive.close() }
    }
}
tasks.named('assemble') { dependsOn tasks.named('verifyBundledMotionResources') }

// Website-feedback regressions run only in disposable GameTest worlds.
if (project.hasProperty('feedbackTest')) {
    sourceSets.main.java.srcDir('src/feedbackTest/java')
}

if (project.hasProperty('feedbackVisual')) {
    sourceSets.main.java.srcDir('src/feedbackVisualTest/java')
    neoForge.runs.client {
        systemProperty 'blacklight.feedbackVisual', 'true'
        systemProperty 'blacklight.feedbackDirectory', file(project.property('clientRunDirectory')).absolutePath
        programArguments.addAll '--width', '960', '--height', '640'
    }
}
tasks.withType(Jar).configureEach { exclude "com/codex/blacklight/client/FeedbackRenderSmoke*.class" }

