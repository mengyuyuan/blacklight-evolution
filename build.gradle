plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

// A normal clone includes the complete runtime profile. An explicit developer
// directory replaces it as one profile, preserving the runtime override contract.
def bundledMotionDirectory = providers.gradleProperty('bundleMotionDirectory').orElse('art/motion-profile')
def releaseProfile = providers.gradleProperty('bundleMotionDirectory').isPresent() ? 'external-profile' : 'bundled'
def releaseNotices = ['LICENSE', 'THIRD_PARTY_ASSETS.md', 'THIRD_PARTY_NOTICES.md']
sourceSets {
    resourceTools {
        java {
            srcDirs = ['src/main/java', 'tools']
            include 'com/codex/blacklight/util/CompactJson.java', 'com/codex/blacklight/util/CompactStreams.java', 'com/codex/blacklight/util/MapResources.java', 'CompactMotionPacker.java', 'CompactMapPacker.java'
        }
    }
}
def compactMotionOutput=layout.buildDirectory.dir('generated/compactMotionProfile')
def compactMapOutput=layout.buildDirectory.dir('generated/compactMapResources')
def compactMapManifest=layout.buildDirectory.file('generated/compactMapManifest.json')
def compactMapState=[names:null]
def compactMapNames={
    if(compactMapState.names!=null)return compactMapState.names
    def manifest=compactMapManifest.get().asFile
    if(manifest.isFile()) {
        compactMapState.names=new groovy.json.JsonSlurper().parse(manifest).converted.toSet()
        return compactMapState.names
    }
    return [] as Set
}

def encodeCompactMaps=tasks.register('encodeCompactMaps',JavaExec) {
    classpath=sourceSets.resourceTools.runtimeClasspath
    mainClass='CompactMapPacker'
    args file('src/main/resources').absolutePath,compactMapOutput.get().asFile.absolutePath
    inputs.files(fileTree('src/main/resources') {
        include 'data/blacklight/worldmap/**/*.gz','data/blacklight/city/futian/*.gz','data/blacklight/city/los_angeles/*.gz'
    })
    outputs.dir(compactMapOutput)
    outputs.file(compactMapManifest)
    maxHeapSize='384m'
    jvmArgs '-XX:ActiveProcessorCount=2'
    javaLauncher=javaToolchains.launcherFor {languageVersion=JavaLanguageVersion.of(17)}
    doLast {compactMapState.names=null}
}
sourceSets.main.resources.srcDir(compactMapOutput)
def encodeCompactMotions=tasks.register('encodeCompactMotions', JavaExec) {
    classpath=sourceSets.resourceTools.runtimeClasspath
    mainClass='CompactMotionPacker'
    args file(bundledMotionDirectory.get()).absolutePath, compactMotionOutput.get().asFile.absolutePath
    inputs.dir(bundledMotionDirectory)
    outputs.dir(compactMotionOutput)
    maxHeapSize='512m'
    jvmArgs '-XX:ActiveProcessorCount=2'
    javaLauncher=javaToolchains.launcherFor {languageVersion=JavaLanguageVersion.of(17)}
}
def stageBundledMotions = tasks.register('stageBundledMotions', Sync) {
    dependsOn encodeCompactMotions
    into layout.buildDirectory.dir('generated/bundledMotionResources')
    if (bundledMotionDirectory.isPresent()) {
        from(compactMotionOutput) {
            into 'blacklight/bundled_motions'
            include '*.json', '*.data', '*.jz'
        }
        doFirst {
            def profile = file(bundledMotionDirectory.get())
            ['health-hud.data', 'camera-film.data', 'morph_claws.json', 'morph_blade.json', 'morph_hammerfists.json', 'morph_muscle_mass.json', 'morph_whipfist.json', 'morph_thermal_vision.json'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete cinematic motion profile: ${it}")
            }
            ['utility_shield_deploy.json', 'utility_shield_hit.json', 'utility_shield_run.json', 'utility_shield_sprint.json', 'utility_armor_transform.json', 'utility_armor_idle.json', 'basic_idle.json', 'basic_wall_top.json', 'basic_parkour_small.json', 'combat-motion-tuning.data', 'consume-placement.data', 'receiver-poses.data', 'hunter-consume.data', 'hammer-scales.data', 'weapon-attack-scales.data', 'armor-growth.data', 'camera-profile.data', 'camera-events.data'].each {
                if (!new File(profile, it).isFile()) throw new GradleException("Incomplete bundled motion profile: ${it}")
            }
            ['dev_groundspike','dev_air_groundspike','dev_tendril','dev_air_tendril','dev_critical_pain','dev_air_critical_pain','bulletdive_drop'].each { skill ->
                ['', '_charge', '_recovery'].each { suffix ->
                    if (!new File(profile, skill + suffix + '.json').isFile())
                        throw new GradleException("Incomplete source skill profile: ${skill}${suffix}")
                }
            }
            ['dev_critical_pain_aim_up','dev_critical_pain_aim_down','dev_air_critical_pain_aim_up','dev_air_critical_pain_aim_down','bulletdive_drop_land','bulletdive_drop_flight'].each {
                if (!new File(profile, it + '.json').isFile()) throw new GradleException("Incomplete source skill profile: ${it}")
            }
        }
    }
}
sourceSets.main.resources.srcDir(stageBundledMotions)
tasks.named('processResources', ProcessResources).configure {
    dependsOn encodeCompactMaps
    inputs.property('blacklightReleaseProfile', releaseProfile)
    exclude { details -> compactMapNames().contains(details.path) }
    doFirst {
        def outputRoot=destinationDir.toPath().toAbsolutePath().normalize()
        def ownedRoot=layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        if(!outputRoot.startsWith(ownedRoot))throw new GradleException('Compressed map staging escapes build directory')
        compactMapNames().each { name -> java.nio.file.Files.deleteIfExists(outputRoot.resolve(name)) }
        // Remove previous uncompressed profile entries only from our build output.
        def motionRoot=outputRoot.resolve('blacklight/bundled_motions')
        if(java.nio.file.Files.isDirectory(motionRoot)) {
            def paths=java.nio.file.Files.list(motionRoot)
            try {paths.filter { p -> p.fileName.toString().matches('[a-z0-9_-]+\\.(json|data)(\\.jz)?') }.forEach { java.nio.file.Files.delete(it) }}
            finally {paths.close()}
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
}

base {
    archivesName = "${mod_archive_name}-MC${minecraft_version}-Forge"
}

// Forge requires the MixinExtras runtime that NeoForge supplies by default.
jarJar.enable()

// Keep both version numbers in every release; never hand-name the install ZIP.
def distributionZip = tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Packages the Forge 1.20.1 candidate with complete motions and notices.'
    archiveBaseName = base.archivesName
    archiveVersion = project.version.toString()
    archiveClassifier = releaseProfile
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jarJar')) { into 'mods' }
    from('README.md')
    from(releaseNotices)
    from('docs') { into 'docs' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn(distributionZip) }
tasks.named('assemble') {
    description = 'Compiles and packages the complete Forge 1.20.1 runtime candidate.'
}

// Minecraft 1.20.1 and Forge 47 target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Real optional-mod integration tests, never bundled into release jars.
if (project.hasProperty('compatLiveTest')) {
    sourceSets.main.java.srcDir('src/compatTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}

if (['hydraReleaseTest','entityLifecycleTest','hiveFeedingTest','wallTraversalTest','standaloneTest','cityTest'].any { project.hasProperty(it) }) {
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}
if (project.hasProperty('hydraReleaseTest')) {
    sourceSets.main.java.srcDir('src/hydraTest/java')
}
if (project.hasProperty('hydraVisualTest')) sourceSets.main.java.srcDir('src/hydraVisualTest/java')
if (project.hasProperty('wingTest')) sourceSets.main.java.srcDir('src/wingTest/java')

// Opt-in screenshot harness is excluded from normal builds and distributable JARs.
if (project.hasProperty('entityLifecycleTest')) {
    sourceSets.main.java.srcDir('src/entityLifecycleTest/java')
}
if (project.hasProperty('hiveFeedingTest')) {
    sourceSets.main.java.srcDir('src/hiveTest/java')
}
if (project.hasProperty('wallTraversalTest')) {
    sourceSets.main.java.srcDir('src/traversalTest/java')
}
if (project.hasProperty('standaloneVisual') || project.hasProperty('standaloneGait') || project.hasProperty('standaloneLock') || project.hasProperty('standaloneMorph') || project.hasProperty('standaloneSkill') || project.hasProperty('standaloneSync')) {
    sourceSets.main.java.srcDir('src/standaloneVisualTest/java')
    if (!project.hasProperty('standaloneSync')) sourceSets.main.java.exclude '**/StandaloneSyncClientSmoke.java', '**/StandaloneSyncServerChecks.java'
}
if (project.hasProperty('standaloneInfected')) {
    sourceSets.main.java.srcDir('src/infectedVisualTest/java')
}
if (project.hasProperty('standaloneTest')) {
    sourceSets.main.java.srcDir('src/standaloneTest/java')
}
if (project.hasProperty('cityTest')) {
    sourceSets.main.java.srcDir('src/cityTest/java')
    sourceSets.main.resources.srcDir('src/cityTest/resources')
}
tasks.withType(Jar).configureEach {
    archiveClassifier = releaseProfile
    from(releaseNotices)
    manifest.attributes('MixinConfigs': 'blacklight.mixins.json',
            'Blacklight-Build-Profile': releaseProfile,
            'Blacklight-Motion-Source': releaseProfile == 'bundled' ? 'repository' : 'external',
            'Blacklight-Bundled-Motions': 'true',
            'Blacklight-Public-Release-Ready': 'false',
            'Blacklight-Asset-Notice': 'THIRD_PARTY_ASSETS.md')
    exclude 'com/codex/blacklight/gametest/**'
    exclude 'com/codex/blacklight/client/HydraReleaseSmoke*.class', 'com/codex/blacklight/client/CreatureCombatSmoke*.class'
    exclude 'com/codex/blacklight/city/*GameTest*.class'
    exclude 'com/codex/blacklight/client/Standalone*Smoke*.class'
    exclude 'com/codex/blacklight/client/WingFlightSmoke*.class'
    exclude 'com/codex/blacklight/client/WingSupersonicSmoke*.class'
    exclude 'com/codex/blacklight/client/Standalone*Checks*.class'
    exclude 'com/codex/blacklight/client/InfectedCompositionSmoke*.class'
    exclude 'data/blacklight/structures/wall_test.nbt'
    exclude 'data/minecraft/worldgen/world_preset/flat.json'
    exclude 'data/blacklight/dimension/city_futian.json', 'data/blacklight/dimension/city_legacy.json'
}

minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('localWeaponMotions'))
                property 'blacklight.localWeaponMotions', file(project.property('localWeaponMotions')).absolutePath
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {
            if (project.hasProperty('wingTest')) {
                property 'blacklight.test.wings', 'true'
                if(project.hasProperty('wingQaDirectory')) property 'blacklight.test.wingDirectory', file(project.property('wingQaDirectory')).absolutePath
                if (project.hasProperty('wingSonicTest')) property 'blacklight.test.wingSonic', 'true'
                if (project.hasProperty('wingSonicClimbTest')) property 'blacklight.test.wingSonicClimb', 'true'
                if (project.hasProperty('wingArmorTest')) property 'blacklight.test.wingArmor', 'true'
                args '--width', '960', '--height', '540'
            }
            if (project.hasProperty('clientRunDirectory')) workingDirectory file(project.property('clientRunDirectory'))
            else if (project.hasProperty('standaloneMorph')) workingDirectory project.file('run-forge-qa')
            jvmArgs '-Xmx'+(project.findProperty('clientMaxHeap') ?: '3G')
            if(project.hasProperty('hydraVisualTest')) { property 'blacklight.hydraVisual', 'true'; args '--width', '960', '--height', '640' }
            if (project.hasProperty('quickPlayWorld')) args '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
            if (project.hasProperty('standaloneInfected')) property 'blacklight.test.infectedComposition', file(project.property('standaloneInfected')).absolutePath
            if (project.hasProperty('standaloneMorph')) {
                property 'blacklight.test.qaDirectory', file(project.findProperty('clientRunDirectory') ?: 'run-forge-qa').absolutePath
                property 'blacklight.test.standaloneMorph', file(project.property('standaloneMorph')).absolutePath
                if (project.hasProperty('standaloneMorphCases')) property 'blacklight.test.standaloneMorph.cases', project.property('standaloneMorphCases').toString()
                args '--width', '960', '--height', '640'
            }
            if (project.hasProperty('openAnimationTuner')) property 'blacklight.test.openAnimationTuner', 'true'
            ['standaloneVisual', 'standaloneGait', 'standaloneLock', 'standaloneSkill', 'standaloneSync'].each { hook ->
                if (project.hasProperty(hook)) property "blacklight.test.${hook}", file(project.property(hook)).absolutePath
            }
            if (project.hasProperty('standaloneVisualShots')) property 'blacklight.test.standaloneVisual.shots', project.property('standaloneVisualShots').toString()
            if (project.hasProperty('standaloneSkillCases')) property 'blacklight.test.standaloneSkill.cases', project.property('standaloneSkillCases').toString()
            if (project.hasProperty('standaloneGaitStandingCharge')) property 'blacklight.test.standaloneGait.standingCharge', 'true'
            if (project.hasProperty('standaloneGaitClaws')) property 'blacklight.test.standaloneGait.claws', 'true'
            if (project.hasProperty('standaloneGaitJump')) property 'blacklight.test.standaloneGait.jumpOnly', 'true'
        }
        server {
            if (project.hasProperty('serverRunDirectory')) workingDirectory file(project.property('serverRunDirectory'))
            args '--nogui'
            jvmArgs '-Xmx'+(project.findProperty('gameTestMaxHeap') ?: '2G')
        }
        gameTestServer {
            workingDirectory project.file(project.findProperty('gameTestRunDirectory') ?: 'run-standalone-gametest')
            jvmArgs '-Xmx'+(project.findProperty('gameTestMaxHeap') ?: '2G')
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
}
mixin {
    add sourceSets.main, 'blacklight.refmap.json'
    config 'blacklight.mixins.json'
}

// MixinGradle writes these outside JavaCompile's normal class output. Declare
// both so clean builds restored from Gradle's cache retain runtime mappings.
tasks.named('compileJava', JavaCompile) {
    outputs.files(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'),
            layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
            .withPropertyName('mixinAnnotationProcessorOutputs')
    // MixinGradle's JAR injection also skips cache-restored compiler outputs.
    // Until that plugin supports restoration, run main annotation processing
    // on clean builds; other tasks retain their normal cache behavior.
    outputs.cacheIf('MixinGradle requires fresh annotation processing for JAR injection') { false }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    resourceToolsImplementation 'org.tukaani:xz:1.10'
    implementation(jarJar('org.tukaani:xz:1.10')) {
        jarJar.ranged(it, '[1.10,1.11)')
        jarJar.pin(it, '1.10')
    }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
        jarJar.pin(it, '0.4.1')
    }

    // Optional compatibility API only. The user installs the two mods independently.
    compileOnly fg.deobf("maven.modrinth:parcool:${minecraft_version}-3.4.3.3")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // BlacklightState exposes a Minecraft Codec; plain JVM tests therefore need DFU too.
    testImplementation 'com.mojang:datafixerupper:6.0.8'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation files(sourceSets.main.compileClasspath)
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

def forgeTestClasses = layout.buildDirectory.dir('forge-test-classes')
def forgeTestRuntime = files(forgeTestClasses, sourceSets.test.runtimeClasspath)
def prepareForgeCapabilityTests = tasks.register('prepareForgeCapabilityTests') {
    dependsOn tasks.named('compileJava')
    inputs.files(sourceSets.main.output.classesDirs, sourceSets.main.compileClasspath)
    outputs.dir(forgeTestClasses)
    doLast {
        // Use Forge's real launch transformer, rather than replacing capabilities with mocks.
        def urls = files(sourceSets.main.output.classesDirs, sourceSets.main.compileClasspath).files.collect {
            it.toURI().toURL()
        } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        try {
            def nodeClass = loader.loadClass('org.objectweb.asm.tree.ClassNode')
            def readerClass = loader.loadClass('org.objectweb.asm.ClassReader')
            def writerClass = loader.loadClass('org.objectweb.asm.ClassWriter')
            def visitorClass = loader.loadClass('org.objectweb.asm.ClassVisitor')
            def typeClass = loader.loadClass('org.objectweb.asm.Type')
            def phaseClass = loader.loadClass('cpw.mods.modlauncher.serviceapi.ILaunchPluginService$Phase')
            def transformer = loader.loadClass('net.minecraftforge.fml.common.asm.CapabilityTokenSubclass').getConstructor().newInstance()
            def transform = transformer.class.getMethod('processClassWithFlags', phaseClass, nodeClass, typeClass, String.class)
            ['net/minecraftforge/common/capabilities/CapabilityToken',
             'com/codex/blacklight/forge/BlacklightAttachments$1'].each { name ->
                byte[] original = loader.getResourceAsStream("${name}.class").withCloseable { it.readAllBytes() }
                def node = nodeClass.getConstructor().newInstance()
                readerClass.getConstructor(byte[].class).newInstance([original] as Object[]).accept(node, 0)
                transform.invoke(transformer, phaseClass.getField('BEFORE').get(null), node,
                        typeClass.getMethod('getObjectType', String.class).invoke(null, name), 'blacklight-junit')
                def writer = writerClass.getConstructor(int.class).newInstance(1)
                nodeClass.getMethod('accept', visitorClass).invoke(node, writer)
                def target = new File(forgeTestClasses.get().asFile, "${name}.class")
                target.parentFile.mkdirs()
                target.bytes = writer.toByteArray()
            }
            // Bootstrap invokes Forge's real network event bus. In a normal
            // launch ModLauncher supplies these event constructors/listeners;
            // the plain JVM harness must run that same event transformer too.
            def eventTransformer=loader.loadClass('net.minecraftforge.eventbus.EventSubclassTransformer').getConstructor().newInstance()
            def eventLoader=eventTransformer.class.getDeclaredField('gameClassLoader')
            eventLoader.setAccessible(true)
            eventLoader.set(eventTransformer,java.util.Optional.of(loader))
            def eventTransform=eventTransformer.class.getMethod('transform',nodeClass,typeClass)
            def contextThread=Thread.currentThread()
            def previousContextLoader=contextThread.contextClassLoader
            contextThread.contextClassLoader=loader
            try {
            ['', '$ChannelRegistrationChangeEvent', '$ClientCustomPayloadEvent', '$ClientCustomPayloadLoginEvent',
             '$GatherLoginPayloadsEvent', '$LoginPayloadEvent', '$ServerCustomPayloadEvent', '$ServerCustomPayloadLoginEvent'].each { suffix ->
                String name='net/minecraftforge/network/NetworkEvent'+suffix
                byte[] original=loader.getResourceAsStream("${name}.class").withCloseable {it.readAllBytes()}
                def node=nodeClass.getConstructor().newInstance()
                readerClass.getConstructor(byte[].class).newInstance([original] as Object[]).accept(node,0)
                def transformed=eventTransform.invoke(eventTransformer,node,typeClass.getMethod('getObjectType',String.class).invoke(null,name))
                if(transformed.isPresent()) {
                    def writer=writerClass.getConstructor(int.class).newInstance(1)
                    nodeClass.getMethod('accept',visitorClass).invoke(transformed.get(),writer)
                    def target=new File(forgeTestClasses.get().asFile,"${name}.class")
                    target.parentFile.mkdirs();target.bytes=writer.toByteArray()
                }
            }
            } finally {contextThread.contextClassLoader=previousContextLoader}
        } finally {
            loader.close()
        }
    }
}

tasks.named('test', Test).configure {
    dependsOn prepareForgeCapabilityTests
    classpath = forgeTestRuntime
    useJUnitPlatform()
    // Native pose tests use the project-authored mathematical bind hierarchy.
}

// Java 17 on Windows reads launcher argument files in the system code page.
// An ASCII-path manifest JAR preserves UTF-8 project paths through URI encoding.
if (System.getProperty('os.name').startsWith('Windows') && projectDir.absolutePath.any { (int) it > 127 }) {
    def testClasspathJar = tasks.register('testClasspathJar', Jar) {
        dependsOn prepareForgeCapabilityTests, tasks.named('testClasses')
        inputs.files(forgeTestRuntime)
        archiveFileName = "blacklight-tests-${Integer.toUnsignedString(projectDir.absolutePath.hashCode())}.jar"
        destinationDirectory = file("${gradle.gradleUserHomeDir}/blacklight-test-classpaths")
        doFirst {
            manifest.attributes('Class-Path': forgeTestRuntime.files.collect {
                it.toURI().toASCIIString()
            }.join(' '))
        }
    }
    tasks.named('test', Test) {
        dependsOn testClasspathJar
        classpath = files(testClasspathJar)
    }
}

// Metadata must stay UTF-8 even when Gradle runs on a Windows legacy code page.
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            geckolib_version       : geckolib_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
tasks.named('processResources') { dependsOn generateModMetadata }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
// Publication is a separate step after the Forge runtime candidate is accepted.
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    doFirst {
        throw new GradleException("Publishing is disabled for ${releaseProfile}: the Forge candidate has not been approved for publication.")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// This source set deliberately has no Minecraft, NeoForge or Epic Fight dependency.
sourceSets {
    standaloneMotion {
        java {
            srcDirs = ['src/main/java', 'tools']
            include 'com/codex/blacklight/animation/MatrixMotionClip.java', 'com/codex/blacklight/util/MathCompat.java', 'StandaloneMotionProbe.java'
        }
    }
}
dependencies {
    standaloneMotionImplementation 'com.google.code.gson:gson:2.10.1'
    standaloneMotionImplementation 'org.joml:joml:1.10.5'
}
tasks.register('verifyStandaloneMotionAssets', JavaExec) {
    group = 'verification'
    description = 'Samples the supplied motion archive without the game or Epic Fight on the classpath.'
    dependsOn tasks.named('standaloneMotionClasses')
    classpath = sourceSets.standaloneMotion.runtimeClasspath
    mainClass = 'StandaloneMotionProbe'
    maxHeapSize = '1G'
    doFirst {
        def archive = providers.gradleProperty('motionProbeArchive')
        if (!archive.isPresent()) throw new GradleException('Supply -PmotionProbeArchive=<Forge 1.20.1 bundled jar>')
        args = [archive.get()]
    }
}

tasks.register('verifyStandaloneBoundary') {
    group = 'verification'
    description = 'Rejects compiled references and runtime dependencies on Epic Fight or WoM.'
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = configurations.runtimeClasspath.files.findAll {
            def name = it.name.toLowerCase(Locale.ROOT)
            name.contains('epic-fight') || name.contains('epicfight') || name.contains('weaponsofmiracles')
        }.collect { it.name }
        def linked = []
        sourceSets.main.output.classesDirs.files.each { root ->
            fileTree(root).matching { include '**/*.class' }.each { compiled ->
                def constants = new String(compiled.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('yesman/epicfight') || constants.contains('reascer/wom'))
                    linked.add(root.toPath().relativize(compiled.toPath()).toString())
            }
        }
        if (!forbidden.empty || !linked.empty) {
            throw new GradleException("Not standalone: dependencies=${forbidden}; ${linked.size()} classes still reference old engines. See docs/STANDALONE_MIGRATION.md.")
        }
    }
}

// Every installable artifact must pass the independent runtime boundary.
tasks.named('jar') { dependsOn tasks.named('verifyStandaloneBoundary') }
tasks.named('jarJar') { dependsOn tasks.named('verifyStandaloneBoundary') }

// Forge runtime JARs must be reobfuscated before distribution.
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.named('jar') { archiveClassifier = "${releaseProfile}-slim" }
reobf { jarJar {} }
tasks.named('jarJar') { finalizedBy 'reobfJarJar' }
tasks.named('distributionZip') { dependsOn 'reobfJarJar' }

// CI and a fresh clone must never produce another motion-less installable JAR.
tasks.register('verifyBundledMotionResources') {
    group = 'verification'
    dependsOn tasks.named('reobfJarJar')
    doLast {
        def source = file(bundledMotionDirectory.get())
        def profile = fileTree(source).matching { include '*.json', '*.data'; exclude 'devastator-fx.data' }.files
        if (profile.empty || !new File(source, 'basic_idle.json').isFile())
            throw new GradleException('A complete runtime motion profile is required')
        def manifest = releaseProfile == 'bundled'
                ? new groovy.json.JsonSlurper().parse(file('art/motion-profile-manifest.json')).files : null
        if (manifest != null && profile.collect { it.name }.toSet() != manifest.keySet())
            throw new GradleException('Repository motion inventory does not match its manifest')
        def archive = new java.util.zip.ZipFile(tasks.named('jarJar', Jar).get().archiveFile.get().asFile)
        try {
            def refmapEntry = archive.getEntry('blacklight.refmap.json')
            if (refmapEntry == null) throw new GradleException('Missing Forge Mixin refmap in installable JAR')
            def refmap = archive.getInputStream(refmapEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            if (!refmap.mappings || !refmap.data?.searge)
                throw new GradleException('Empty Forge Mixin runtime mappings')
            profile.each { input ->
                def entry = archive.getEntry("blacklight/bundled_motions/${input.name}")
                if (entry == null) throw new GradleException("Missing bundled motion: ${input.name}")
                def packed = archive.getInputStream(entry).withCloseable { it.readAllBytes() }
                if (!java.util.Arrays.equals(packed, input.bytes))
                    throw new GradleException("Bundled motion changed: ${input.name}")
                if (manifest != null) {
                    def expected = manifest[input.name]
                    if (packed.length != expected.bytes)
                        throw new GradleException("Motion manifest size mismatch: ${input.name}")
                    if (expected.sha256 != null) {
                        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(packed).encodeHex().toString()
                        if (hash != expected.sha256)
                            throw new GradleException("Motion manifest mismatch: ${input.name}")
                    }
                }
            }
            logger.lifecycle("Verified ${profile.size()} unchanged bundled motion/profile files")
        } finally { archive.close() }
    }
}
tasks.named('assemble') { dependsOn tasks.named('verifyBundledMotionResources') }

// Website-feedback regressions run only in disposable GameTest worlds.
if (project.hasProperty('feedbackTest')) {
    sourceSets.main.java.srcDir('src/feedbackTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
}

if (project.hasProperty('feedbackVisual')) {
    sourceSets.main.java.srcDir('src/feedbackVisualTest/java')
    minecraft.runs.client {
        property 'blacklight.feedbackVisual', 'true'
        property 'blacklight.feedbackDirectory', file(project.property('clientRunDirectory')).absolutePath
        args '--width', '960', '--height', '640'
    }
}

tasks.withType(Jar).configureEach { exclude "com/codex/blacklight/client/FeedbackRenderSmoke*.class" }

// Optional real Twilight Forest integration tests; absent from normal builds and release jars.
if (project.hasProperty('twilightTest')) {
    sourceSets.main.java.srcDir('src/twilightTest/java')
    sourceSets.main.resources.srcDir('src/traversalTest/resources')
    repositories.maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    dependencies { localRuntime fg.deobf('curse.maven:the-twilight-forest-227639:5468648') }
}
