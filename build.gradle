// Keep generated Arnis regions as immutable files in development and package them normally.
// The archive packer regenerates by atomic replacement, so links never cause in-place writes.
def losAngelesArnisRoot = file('src/main/resources/data/blacklight/city/los_angeles_full')
def losAngelesArnisArchives = fileTree(losAngelesArnisRoot) { include '*.lar' }
tasks.named('processResources', ProcessResources).configure {
    exclude 'data/blacklight/city/los_angeles_full/*.lar'
    def needsOriginalArchives=!geographicCity.get() && !file('src/main/resources/data/blacklight/city/los_angeles_compact/index.json').isFile()
    if(needsOriginalArchives)inputs.files(losAngelesArnisArchives).withPropertyName('losAngelesArnisArchives')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    doLast {
        if(!needsOriginalArchives)return
        def metadata = new groovy.json.JsonSlurper().parse(new File(losAngelesArnisRoot, 'index.json'))
        if (metadata.schema != 2 || metadata.complete != true)
            throw new GradleException('Complete Los Angeles Arnis resources are required')
        def expected = metadata.regions.collect { "${it.x}_${it.z}.lar".toString() }.toSet()
        def archives = losAngelesArnisArchives.files.sort { it.name }
        if (archives.collect { it.name }.toSet() != expected)
            throw new GradleException('Los Angeles Arnis region inventory differs from its index')
        def outputRoot = destinationDir.toPath().resolve('data/blacklight/city/los_angeles_full').toAbsolutePath().normalize()
        def buildRoot = layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        if (!outputRoot.startsWith(buildRoot)) throw new GradleException('Arnis output escapes build directory')
        java.nio.file.Files.createDirectories(outputRoot)
        int linked = 0
        archives.each { input ->
            def target = outputRoot.resolve(input.name)
            if (java.nio.file.Files.exists(target) && java.nio.file.Files.isSameFile(input.toPath(), target)) {
                linked++
            } else {
                def staged = outputRoot.resolve(input.name + '.linking')
                java.nio.file.Files.deleteIfExists(staged)
                try {
                    try {
                        java.nio.file.Files.createLink(staged, input.toPath())
                        linked++
                    } catch (java.io.IOException | UnsupportedOperationException unavailable) {
                        java.nio.file.Files.copy(input.toPath(), staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                    java.nio.file.Files.move(staged, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                } finally {
                    java.nio.file.Files.deleteIfExists(staged)
                }
            }
        }
        def oldFiles = java.nio.file.Files.list(outputRoot)
        try {
            oldFiles.filter { it.fileName.toString().endsWith('.lar') && !expected.contains(it.fileName.toString()) }
                .forEach { java.nio.file.Files.delete(it) }
        } finally { oldFiles.close() }
        logger.lifecycle("Prepared ${archives.size()} complete Arnis regions (${linked} immutable links)")
    }
}
