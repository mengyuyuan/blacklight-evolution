#感染宿主成长与器官整合。倍率0允许暂停对应过程；不会追赶离线时间。
[evolution]
	#吞食普通猎物获得养分的倍率；仍遵守容积与真实吞食规则。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	preyNutrientMultiplier = 1.0
	#缺乏养分时器官整合速度占正常速度的比例。
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	unfedIntegrationFraction = 0.2
	#感染宿主成长及继承带来的额外生命倍率；0取消该成长增益，不删除基础生命。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	hostHealthGrowthMultiplier = 1.0
	#有养分且停止受伤后，每次代谢恢复的最大生命比例。
	# Default: 0.005
	# Range: 0.0 ~ 0.5
	repairMaxHealthFraction = 0.005
	#总进化速度倍率，同时影响自然生长、食物加速和器官整合；0暂停。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	growthSpeedMultiplier = 1.0
	#成长加速的养分消耗倍率；不产生无活动自然流失。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	growthNutrientCostMultiplier = 1.0
	#每次代谢更新中，有养分时额外推进的基础生长刻；更新周期仍由服务器控制。
	# Default: 180
	# Range: 0 ~ 24000
	fedBonusGrowthTicks = 180
	#感染宿主成长及继承带来的额外攻击增益倍率。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	hostAttackGrowthMultiplier = 1.0
	#后续每代增加的加速养分需求；不是直接一次性扣除。
	# Default: 3.0
	# Range: 0.0 ~ 100000.0
	additionalNutrientsPerGeneration = 3.0
	#受伤后暂停养分修复的刻数。
	# Default: 100
	# Range: 0 ~ 24000
	repairDelayTicks = 100
	#世界天数加速的基准游戏天数；1天=24000世界日照刻。
	# Default: 7.0
	# Range: 1.0 ~ 1000000.0
	worldAgeReferenceDays = 7.0
	#世界天数加速强度；0关闭。速度=总倍率×(1+强度×sqrt(世界天数/基准天数))。
	# Default: 1.0
	# Range: 0.0 ~ 20.0
	worldAgeAcceleration = 1.0
	#感染宿主成长及继承带来的额外护甲增益倍率。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	hostArmorGrowthMultiplier = 1.0
	#最初生长阶段加速所需的基础养分估计值。
	# Default: 4.0
	# Range: 0.0 ~ 100000.0
	initialStageNutrients = 4.0
	#吞噬后器官消化、整合的额外速度倍率。
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	organIntegrationMultiplier = 1.0
