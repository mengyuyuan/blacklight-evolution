#感染传播。概率使用0～1；20 tick约1秒。仅服务端决定结果；不修改强制感染指令。
[infection]
	#摔瓶感染半径，单位方块；仍检查墙壁与真实距离。
	# Default: 16.0
	# Range: 1.0 ~ 64.0
	vialRadius = 16.0
	#直接命中可感染生物时的概率；默认必定。玩家觉醒仍为自愿。
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	vialDirectHitChance = 1.0
	#允许感染生物的近战攻击传播病毒。
	contactEnabled = true
	#同一受害者两次接触感染尝试的间隔；失败也进入冷却。
	# Default: 200
	# Range: 1 ~ 240000
	contactCooldownTicks = 200
	#溅射中心感染概率。
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	vialCenterChance = 1.0
	#每个接触冷却窗口的近战感染概率；0关闭，1必定。
	# Default: 0.08
	# Range: 0.0 ~ 1.0
	contactChance = 0.08
	#溅射边缘感染概率；中心到边缘线性插值。
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	vialEdgeChance = 0.5

#组织占领建筑与繁殖；空间范围、工作预算、成熟时间和开关见blacklight-building-infection-server.toml。
[buildings]
	#每轮到期繁殖尝试概率；失败不消耗养分，0关闭繁殖。
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	broodChance = 1.0
	#每个建筑成熟阶段增加的自主养分。
	# Default: 2
	# Range: 0 ~ 10000
	occupationNutrientsPerStage = 2
	#成熟建筑两轮繁殖尝试的间隔刻数；有养分且可生长时计时。
	# Default: 600
	# Range: 20 ~ 240000
	broodIntervalTicks = 600
	#自然组织尝试建立建筑核心的概率。
	# Default: 0.0625
	# Range: 0.0 ~ 1.0
	naturalCoreChance = 0.0625
	#稳定附着建筑的自主供能间隔刻数。
	# Default: 40
	# Range: 5 ~ 240000
	occupationIncomeIntervalTicks = 40
	#每轮自主供能基础养分；不是玩家背包或物品复制。
	# Default: 2
	# Range: 0 ~ 10000
	occupationBaseNutrients = 2
	#建筑繁殖养分费用倍率；最终至少1。
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	broodNutrientCostMultiplier = 1.0
	#每多少次建筑出生优先尝试猎手，仍需世界阶段允许；0关闭此优先项。
	# Default: 4
	# Range: 0 ~ 10000
	hunterEveryBirths = 4

#自然环境出生与感染。种群上限、总开关、批次与一天长度见blacklight-outbreak-server.toml。
[outbreak]
	#每名玩家每轮在绿区最多成功补充的感染体数，0关闭该玩家区域的补怪；仍受维度共享预算限制。
	# Default: 1
	# Range: 0 ~ 8
	greenBirthsPerPlayer = 1
	#黄区环境刷怪百分比。
	# Default: 55
	# Range: 0 ~ 100
	yellowSpawnChancePercent = 55
	#每批次环境感染尝试的基础概率；还要通过所在区域概率检查。
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	ambientInfectionBaseChance = 0.2
	#进入阶段1需要的释放病毒后游戏天数；有效值至少比上一阶段多1天。
	# Default: 1
	# Range: 1 ~ 1000000
	stage1Day = 1
	#候选点与玩家最大高度差。
	# Default: 96
	# Range: 1 ~ 320
	maximumSpawnHeightDifference = 96
	#红区环境刷怪百分比。
	# Default: 100
	# Range: 0 ~ 100
	redSpawnChancePercent = 100
	#进入阶段3需要的释放病毒后游戏天数；有效值至少比上一阶段多1天。
	# Default: 7
	# Range: 1 ~ 1000000
	stage3Day = 7
	#每次候选位置在绿区允许环境刷怪的百分比，0～100。
	# Default: 12
	# Range: 0 ~ 100
	greenSpawnChancePercent = 12
	#候选刷怪点到玩家的最小水平距离。
	# Default: 28
	# Range: 1 ~ 128
	minimumSpawnDistance = 28
	#每名玩家每批次寻找候选点的最大尝试次数；受共享出生预算约束。
	# Default: 12
	# Range: 1 ~ 32
	spawnPositionAttempts = 12
	#刷怪点必须远离所有玩家的安全距离。
	# Default: 24
	# Range: 0 ~ 128
	playerSpawnSafetyDistance = 24
	#早期保证谱系后的生长宿主比例。
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	earlyGrowingChance = 0.25
	#候选刷怪点的最大水平距离；小于最小值时按最小值处理，不加载未加载区块。
	# Default: 64
	# Range: 1 ~ 128
	maximumSpawnDistance = 64
	#非绿区成功自然出生后播种组织的概率。
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	tissueSeedChance = 0.25
	#绿区局部感染体软上限，仍受总局部上限约束。
	# Default: 8
	# Range: 0 ~ 128
	greenLocalCap = 8
	#早期补足成长谱系的额外尝试概率。
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	earlyLineageChance = 0.1
	#黄区每名玩家每轮最多补充的感染体数。
	# Default: 2
	# Range: 0 ~ 8
	yellowBirthsPerPlayer = 2
	#进入阶段2需要的释放病毒后游戏天数；有效值至少比上一阶段多1天。
	# Default: 3
	# Range: 1 ~ 1000000
	stage2Day = 3
	#进入阶段4需要的释放病毒后游戏天数；有效值至少比上一阶段多1天。
	# Default: 14
	# Range: 1 ~ 1000000
	stage4Day = 14
	#环境随机感染查询半径；仅已加载生物。
	# Default: 64
	# Range: 1 ~ 128
	ambientInfectionRadius = 64
	#优先补足普通补给、成长、成熟谱系名额。关闭后仅按权重出生；权重0不再被名额补足覆盖。
	lineageGuarantees = true
	#每个世界阶段增加的环境感染概率，最终不超过1。
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	ambientInfectionChancePerStage = 0.2
	#红区每名玩家每轮最多补充的感染体数。
	# Default: 3
	# Range: 0 ~ 8
	redBirthsPerPlayer = 3
	#黄区局部感染体软上限。
	# Default: 20
	# Range: 0 ~ 128
	yellowLocalCap = 20

	#阶段1的相对出生权重；无需总和为100。全为0时回退普通感染者；关闭自然出生请用区域概率或总开关。
	[outbreak.stage1Weights]
		# Default: 25
		# Range: 0 ~ 10000
