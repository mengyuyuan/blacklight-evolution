#Shared frontier/aging operations per dimension every five ticks.
# Default: 4
# Range: 1 ~ 16
workBudget = 4
# Default: 48
# Range: 8 ~ 96
horizontalRadius = 48
# Default: 96
# Range: 8 ~ 192
verticalReach = 96
#Grow solid, connected biomass columns using the shared work budget.
buildingBiomass = true
# Default: 8192
# Range: 64 ~ 16384
surfacesPerColony = 8192
#Existing infected tissue can establish a core beside a substantial wall.
naturalCores = true
#Live colony limit; cleared sites retain separate compact reseeding protection.
