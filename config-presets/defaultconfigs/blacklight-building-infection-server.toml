# Range: 1 ~ 64
maxColonies = 16
hatchInfected = true
#Mature attached tissue can pay to assimilate contacted building blocks; clearing gradually restores unchanged recorded material.
assimilateBuildings = true
#Naturally infected, anchored buildings mature and sustain brood over loaded time; feeding remains an optional boost.
autonomousBuildings = true
#Loaded, active seconds; sufficient actual surface growth is also required.
# Default: 600
# Range: 60 ~ 7200
maturitySeconds = 600
buildingInfection = true
# Default: 12
# Range: 0 ~ 32
nearbyMobLimit = 12
