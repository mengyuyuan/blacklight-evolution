name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release collector regressions
        run: python -m unittest discover -s tools/tests -p test_package_release.py

      # Gameplay tests and in-game acceptance remain opt-in. These release
      # checks only inspect inputs and assembled artifacts without launching Minecraft.
      - name: Assemble with Gradle
        run: bash ./gradlew assemble --no-daemon

      - name: Verify release artifacts and source inputs
        run: python tools/package_release.py --profile bundled --verify-only
