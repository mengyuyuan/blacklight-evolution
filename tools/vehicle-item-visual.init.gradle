allprojects { afterEvaluate {
    sourceSets.main.java.srcDir('src/vehicleItemVisual/java')
    minecraft.runs.client {
        property 'blacklight.test.vehicleItems','D:/CodexCache/vehicle-item-qa/forge'
        property 'blacklight.test.hiddenRagdoll','true'
        args '--width','1200','--height','900'
    }
    tasks.withType(Jar).configureEach { doFirst {throw new GradleException('Hidden QA profile cannot produce a release JAR')} }
} }
