// Deferred real-entry destruction/reload regressions, retaining the six chassis placement suite.
allprojects { afterEvaluate {
    sourceSets.main.java.srcDir('src/vehicleTest/java')
    sourceSets.main.java.exclude { entry -> !entry.directory && entry.file.path.replace('\\','/').contains('/src/vehicleTest/') && !['MilitaryVehicleGameTest.java','VehicleTestReadiness.java','VehiclePlacementInteractionGameTest.java','VehicleSupplyGameTest.java','VehicleDestructionLifecycleGameTest.java'].contains(entry.file.name) }
    sourceSets.main.resources.srcDir('src/blackwatchTest/resources')
    sourceSets.main.java.srcDir('src/helicopterTest/java')
    sourceSets.main.java.exclude { entry -> !entry.directory && entry.file.path.replace('\\','/').contains('/src/helicopterTest/') && !['HelicopterDestructionLifecycleGameTest.java'].contains(entry.file.name) }
    sourceSets.main.resources.srcDir('src/helicopterTest/resources')
    def stageVehicleDestructionLifecycleClasses=tasks.register('stageVehicleDestructionLifecycleClasses',Sync){
        dependsOn tasks.named('classes')
        from sourceSets.main.output.classesDirs
        into layout.buildDirectory.dir('vehicle-destruction-lifecycle-run-classes')
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn stageVehicleDestructionLifecycleClasses
        doFirst { environment 'MOD_CLASSES', [layout.buildDirectory.dir('vehicle-destruction-lifecycle-run-classes').get().asFile,sourceSets.main.output.resourcesDir].collect { 'blacklight%%'+it.absolutePath }.join(File.pathSeparator) }
    }
    tasks.withType(Jar).configureEach { doFirst {throw new GradleException('QA cannot produce a release JAR')} }
} }
allprojects { tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' } }
