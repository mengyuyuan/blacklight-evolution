allprojects { afterEvaluate {
    sourceSets.main.java.srcDir('src/creatureCombatVisual/java')
    minecraft.runs.client.property 'blacklight.test.creatureSkills','D:/CodexCache/creature-combat-qa/frames'
    if(project.hasProperty('creatureVisualFirst')) minecraft.runs.client.property 'blacklight.test.creatureFirst',project.property('creatureVisualFirst').toString()
    minecraft.runs.client.args '--width','960','--height','640'
    tasks.withType(Jar).configureEach { exclude 'com/codex/blacklight/client/CreatureSkillsVisual*.class' }
} }
