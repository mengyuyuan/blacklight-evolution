// Explicit normal-server two-PID QA. Same isolated directory: prepare, then verify.
allprojects { afterEvaluate {
    def phase = project.findProperty('vehicleLogisticsAuditPhase')?.toString()
    if (!(phase in ['prepare', 'verify'])) throw new GradleException('Choose -PvehicleLogisticsAuditPhase=prepare or verify')
    if (!project.hasProperty('serverRunDirectory')) throw new GradleException('Set an isolated -PserverRunDirectory under .superpowers')
    def run = project.file(project.property('serverRunDirectory')).canonicalFile
    def qa = project.file('.superpowers').canonicalFile
    if (!run.path.startsWith(qa.path + File.separator)) throw new GradleException('Audit directory must be inside this worktree .superpowers')
    def evidence = new File(run, 'vehicle-logistics-audit.json')
    if (phase == 'prepare') {
        if (new File(run, 'world/level.dat').exists() || evidence.exists()) throw new GradleException('Preserve old audit/world evidence; use a fresh prepare directory')
        run.mkdirs()
        new File(run, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(run, 'server.properties').setText('''level-name=world
level-seed=61028
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
generate-structures=false
online-mode=false
spawn-protection=0
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
allow-nether=false
view-distance=5
simulation-distance=4
server-port=0
enable-query=false
enable-rcon=false
enable-status=false
max-tick-time=-1
sync-chunk-writes=true
''', 'UTF-8')
    } else if (!evidence.isFile() || !new File(run, 'world/level.dat').isFile()) throw new GradleException('Verify needs the actual saved prepare world and evidence')
    sourceSets.main.java.srcDir('src/vehicleTest/java')
    sourceSets.main.java.srcDir('src/vehicleServerTest/java')
    sourceSets.main.resources.srcDir('src/blackwatchTest/resources')
    neoForge.runs.server.systemProperty 'blacklight.vehicleLogisticsAudit', 'true'
    neoForge.runs.server.systemProperty 'blacklight.vehicleLogisticsAudit.phase', phase
    neoForge.runs.server.systemProperty 'blacklight.vehicleLogisticsAudit.file', evidence.absolutePath
    def stageLogisticsAudit = tasks.register('stageLogisticsAudit', Sync) {
        dependsOn tasks.named('classes')
        from sourceSets.main.output
        into layout.buildDirectory.dir('vehicle-logistics-audit-mod')
    }
    tasks.named('runServer').configure {
        dependsOn stageLogisticsAudit
        doFirst { environment 'MOD_CLASSES', 'blacklight%%' + layout.buildDirectory.dir('vehicle-logistics-audit-mod').get().asFile.absolutePath }
    }
} }
allprojects { tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' } }
