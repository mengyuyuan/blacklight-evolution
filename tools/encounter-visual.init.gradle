allprojects { afterEvaluate {
    sourceSets.main.java.srcDir('src/encounterVisual/java')
    minecraft.runs.client.property 'blacklight.test.encounters','D:/CodexCache/encounter-qa/frames'
    if(project.hasProperty('encounterVisualFilter')) minecraft.runs.client.property 'blacklight.test.encounterFilter',project.property('encounterVisualFilter')
    if(project.hasProperty('encounterModelGallery')) minecraft.runs.client.property 'blacklight.test.modelGallery','true'
    if(project.hasProperty('encounterGalleryFilter')) minecraft.runs.client.property 'blacklight.test.galleryFilter',project.property('encounterGalleryFilter')
    minecraft.runs.client.args '--width','960','--height','640'
    tasks.withType(Jar).configureEach { exclude 'com/codex/blacklight/client/EncounterVisual*.class'; exclude 'com/codex/blacklight/client/EncounterModelGallery*.class' }
} }
