// Explicit opt-in only. Production build keeps gametest package excluded.
allprojects { afterEvaluate {
    sourceSets.main.java.srcDir('src/vehicleTest/java')
    if (!sourceSets.main.resources.srcDirs.contains(file('src/blackwatchTest/resources'))) sourceSets.main.resources.srcDir('src/blackwatchTest/resources')
    def stageVehicle6Classes=tasks.register('stageVehicle6Classes',Sync){
        dependsOn tasks.named('classes')
        from sourceSets.main.output.classesDirs
        into layout.buildDirectory.dir('vehicle6-run-classes')
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn stageVehicle6Classes
        // Snapshot classes so a later normal build cannot remove opt-in tests
        // from a running JVM. Reuse immutable resources without recopying all assets.
        doFirst { environment 'MOD_CLASSES', [layout.buildDirectory.dir('vehicle6-run-classes').get().asFile,sourceSets.main.output.resourcesDir].collect { 'blacklight%%'+it.absolutePath }.join(File.pathSeparator) }
    }
} }
allprojects { tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' } }
